name: Build APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache node_modules — skip npm ci entirely on cache hit
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Cache Gradle — biggest time saver (~15 min on first run, ~1 min after)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Generate Android icon mipmap files from app.json
        run: npx expo prebuild --platform android --no-install

      - name: Create Android assets directory
        run: mkdir -p android/app/src/main/assets

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret — refusing to build an APK signed with a public key."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (bundles JS into APK)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee /tmp/cert.txt
          if grep -qi "Android Debug" /tmp/cert.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/memory-ai-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: memory.ai ${{ github.ref_name }}
          body: |
            ## Install

            1. Download `memory-ai-${{ github.ref_name }}.apk` below
            2. On Android: **Settings → Apps → Special app access → Install unknown apps** → allow your browser/Files app
            3. Open the APK and tap Install
            4. Launch memory.ai and tap the mic. Optional: Settings → add an API key for Ask, and a private GitHub repo + token for backup

            ## What's new
            See [CHANGELOG](https://github.com/oneplusiota/memory-ai/commits/main) for details.
          files: android/app/build/outputs/apk/release/memory-ai-${{ github.ref_name }}.apk
